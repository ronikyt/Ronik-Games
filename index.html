<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronik Casino — выбор режима</title>
<style>
    *{ box-sizing:border-box; }

    body{
        min-height:100vh;
        margin:0;
        padding:0 0 40px;
        overflow-x:hidden;
        color:#fff;
        font-family:Arial,sans-serif;
        text-align:center;
        background:
            radial-gradient(circle at 50% 0%,rgba(255,190,0,.18),transparent 38%),
            linear-gradient(160deg,#070707,#1c1200 55%,#080808);
    }

    .pageHeader{
        position:sticky;
        top:0;
        z-index:50;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        padding:10px 0 6px;
        background:linear-gradient(180deg,rgba(7,7,7,0.96),rgba(7,7,7,0.86));
        backdrop-filter:blur(6px);
        box-shadow:0 4px 18px rgba(0,0,0,0.35);
    }

    main{ width:min(920px,calc(100% - 32px)); margin:24px auto 0; }

    .topControls{
        position:relative;
        top:auto;
        left:auto;
        display:flex;
        flex-direction:row;
        align-items:center;
        gap:10px;
        justify-content:center;
        transform:none;
        z-index:10;
    }

    .addToggle{
        width:40px;
        height:40px;
        margin:0;
        padding:0;
        border:1px solid rgba(255,204,0,0.65);
        border-radius:50%;
        background:linear-gradient(135deg,#ffcf28,#ff8500);
        color:#171000;
        font-size:25px;
        line-height:1;
        cursor:pointer;
        box-shadow:0 0 14px rgba(255,180,0,0.28);
    }
    .addToggle:hover{ transform:scale(1.06); }

    .balance{
        position:static;
        transform:none;
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:8px 14px;
        font-size:15px;
        line-height:1.1;
        background:rgba(12,12,12,0.96);
        border-radius:999px;
        border:1px solid rgba(255,255,255,0.08);
        box-shadow:0 12px 30px rgba(0,0,0,0.35);
        color:#fff;
        min-width:120px;
        max-width:240px;
        white-space:nowrap;
        transition:transform .2s,box-shadow .2s;
        z-index:9;
    }

    .balance:hover{
        transform:scale(1.02);
        box-shadow:0 14px 34px rgba(0,0,0,0.45);
    }

    h1{
        margin:0 0 10px;
        font-size:clamp(34px,6vw,58px);
        background:linear-gradient(90deg,#ffe36b,#ff9700,#ffe36b);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    .subtitle{ margin:0 0 38px; color:#c7c7c7; font-size:18px; }

    .modes{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
    }

    .mode{
        min-height:260px;
        padding:28px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        border:2px solid #6a4b00;
        border-radius:24px;
        color:inherit;
        text-decoration:none;
        background:linear-gradient(145deg,#242424,#0d0d0d);
        box-shadow:0 0 28px rgba(255,180,0,.16);
        transition:transform .25s,box-shadow .25s,border-color .25s;
    }

    .mode:hover{
        transform:translateY(-8px) scale(1.02);
        border-color:#ffd633;
        box-shadow:0 12px 38px rgba(255,180,0,.38);
    }

    .mode-icon{ font-size:78px; margin-bottom:14px; }
    .mode h2{ margin:0; color:#ffcf28; font-size:28px; }
    .mode p{ margin:12px 0 20px; color:#d2d2d2; }
    .play{ padding:10px 20px; border-radius:10px; font-weight:bold; background:#c78300; }

    .passModal{
        position:fixed;
        inset:0;
        z-index:10000;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:rgba(0,0,0,0.88);
    }
    .passModal[hidden], .passDialog [hidden]{ display:none !important; }
    .passDialog{
        width:min(440px, calc(100vw - 32px));
        padding:28px 24px;
        border:2px solid #ffcc00;
        border-radius:20px;
        background:linear-gradient(145deg,#171717,#333);
        box-shadow:0 0 32px rgba(255,204,0,0.35);
        text-align:center;
    }
    .passDialog h2{ margin:0 0 16px; color:#ffcc00; }
    .passInput{
        box-sizing:border-box;
        width:100%;
        margin:0 auto 10px;
        padding:12px;
        border:1px solid #444;
        border-radius:10px;
        background:#222;
        color:#fff;
        font-size:18px;
        text-align:center;
    }
    .passError{ min-height:22px; margin-bottom:10px; color:#ff5a5a; font-size:14px; }
    .passActions{ display:flex; justify-content:center; gap:12px; }
    .passActions button{ width:calc(50% - 6px); max-width:170px; min-height:46px; margin:0; }
    .passCancel{ background:#444; color:#fff; }
    .passConfirm{ background:linear-gradient(180deg,#00cc00,#009900); color:#fff; }

    @media (max-width:700px){
        .pageHeader{padding:8px 0 6px;}
        .topControls{margin:0 auto 0; width:min(92vw,820px);}
        .balance{font-size:16px;}
        .subtitle{margin-bottom:20px;}
        .mode{min-height:220px;}
        .modes{gap:14px;}
    }
</style>
</head>
<body>
<div class="pageHeader">
    <div class="topControls">
        <div class="balance">💰 Баланс: <span id="balance">1500</span></div>
        <button class="addToggle" type="button" onclick="openTopUp()" aria-label="Пополнить баланс" title="Пополнить баланс">＋</button>
    </div>
</div>
<div class="passModal" id="passModal" hidden>
    <div class="passDialog" role="dialog" aria-modal="true" aria-labelledby="passTitle">
        <h2 id="passTitle">Пополнение баланса</h2>
        <div id="passwordStep">
            <input class="passInput" id="passInput" type="password" autocomplete="off" placeholder="Пароль" onkeydown="if(event.key==='Enter') checkPassword()">
            <div class="passError" id="passError" role="alert"></div>
            <div class="passActions">
                <button class="passCancel" type="button" onclick="closeTopUp()">Отмена</button>
                <button class="passConfirm" type="button" onclick="checkPassword()">Продолжить</button>
            </div>
        </div>
        <div id="amountStep" hidden>
            <input class="passInput" id="addInput" type="number" min="1" max="10000" step="1" placeholder="Сумма">
            <div class="passError" id="amountError" role="alert"></div>
            <div class="passActions">
                <button class="passCancel" type="button" onclick="closeTopUp()">Отмена</button>
                <button class="passConfirm" type="button" onclick="addMoney()">Добавить</button>
            </div>
        </div>
    </div>
</div>
<main>
    <h1>🎰 Ronik Casino</h1>
    <p class="subtitle">Выберите режим игры</p>
    <section class="modes" aria-label="Режимы игры">
        <a class="mode" href="casino.html">
            <div class="mode-icon">🎡</div>
            <h2>Рулетка Роника</h2>
            <p>Ставки на цвета и монета удачи.</p>
            <span class="play">ИГРАТЬ</span>
        </a>
        <a class="mode" href="miner.html">
            <div class="mode-icon">⛏️</div>
            <h2>Минёр</h2>
            <p>Новый режим. Скоро здесь появится игра.</p>
            <span class="play">ОТКРЫТЬ</span>
        </a>
    </section>
</main>
<script>
    function loadBalance(){
        const storedBalance = localStorage.getItem("ronikCasinoBalance");
        if(storedBalance === null) return 1500;
        const savedBalance = Number(storedBalance);
        return Number.isSafeInteger(savedBalance) && savedBalance >= 0 ? savedBalance : 1500;
    }

    const legacyLogin = localStorage.getItem("ronikCasinoLogin");
    if(legacyLogin){
        const legacyBalance = localStorage.getItem("ronikCasinoBalance:" + legacyLogin);
        if(legacyBalance !== null && Number.isSafeInteger(Number(legacyBalance)) && Number(legacyBalance) >= 0){
            localStorage.setItem("ronikCasinoBalance", legacyBalance);
        }
        localStorage.removeItem("ronikCasinoLogin");
    }

    function updateBalanceDisplay(){
        document.getElementById("balance").textContent = loadBalance();
    }

    const TOP_UP_PASSWORD_HASH = "7b2c97fce79ddcc9bd0b8fb8125ef5996620cf6ef930c2a9d06b848b58d9ca38";
    let topUpAuthorized = false;

    function openTopUp(){
        document.getElementById("passwordStep").hidden = false;
        document.getElementById("amountStep").hidden = true;
        document.getElementById("passInput").value = "";
        document.getElementById("passError").textContent = "";
        document.getElementById("amountError").textContent = "";
        topUpAuthorized = false;
        document.getElementById("passModal").hidden = false;
        document.getElementById("passInput").focus();
    }

    function closeTopUp(){
        document.getElementById("passModal").hidden = true;
        topUpAuthorized = false;
    }

    async function checkPassword(){
        const password = document.getElementById("passInput").value;
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
        const hash = [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, "0")).join("");
        if(hash !== TOP_UP_PASSWORD_HASH){
            document.getElementById("passError").textContent = "Неверный пароль";
            document.getElementById("passInput").value = "";
            document.getElementById("passInput").focus();
            return;
        }
        topUpAuthorized = true;
        document.getElementById("passwordStep").hidden = true;
        document.getElementById("amountStep").hidden = false;
        document.getElementById("addInput").focus();
    }

    function addMoney(){
        if(!topUpAuthorized) return;
        const amount = Number(document.getElementById("addInput").value);
        if(!Number.isSafeInteger(amount) || amount <= 0 || amount > 10000){
            document.getElementById("amountError").textContent = "Введите целое число от 1 до 10000";
            return;
        }
        localStorage.setItem("ronikCasinoBalance", String(loadBalance() + amount));
        closeTopUp();
        updateBalanceDisplay();
    }

    updateBalanceDisplay();
</script>
</body>
</html>
