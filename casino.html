        <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>🎰 Рулетка Роника! 🎰</title>

<style>
html, body{
    min-height:100%;
    margin:0;
    padding:0;

body{
    margin:0;

}
.pageContent{
    position:relative;
    z-index:1;

}

/* Градиентный заголовок */
h1{
    margin:0 0 12px;
    font-size:45px;
    background:linear-gradient(90deg,#ffcc00,#ff8800,#ffcc00);
    -webkit-background-clip:text;

}
@keyframes glow{
    0%{ text-shadow:0 0 20px rgba(255,200,0,0.5); }

/* Баланс */
.balance{

    transform:none;
    display:inline-flex;

.balance:hover{

.pageHeader{
    position:relative;

    flex-direction:column;
    align-items:center;

.topControls{

.addToggle{

    font-size:25px;
    line-height:1;

    box-shadow:0 0 14px rgba(255,180,0,0.28);
}
.addToggle:hover{ transform:scale(1.06); }

.homeLink{
    position:relative;
    align-self:flex-start;

.homeLink:hover{

/* Рулетка */
.roulette{
    width:min(820px, calc(100vw - 32px));
    height:170px;
    margin:40px auto;
    overflow:hidden;
    background:#111;
    border:3px solid #444;
    border-radius:20px;
    position:relative;
    box-shadow:0 0 25px rgba(255,255,255,0.1);
}

.pointer{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:5px;
    height:170px;
    background:white;
    box-shadow:0 0 15px white;
    z-index:5;
}

.track{
    display:flex;
    flex-direction:row;
    position:absolute;
    left:0;
    top:30px;
    transition:transform 5s cubic-bezier(.1,.8,.2,1);
}

.card{
    width:120px;
    height:120px;
    flex:0 0 120px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.red{ background:#d00000; }
.black{ background:#050505; border:1px solid #555; }
.green{ background:#00aa00; border:2px solid #33ff33; }
.yellow{ background:linear-gradient(135deg,#ffd700,#d99b00); color:#171000; border:2px solid #fff09a; }

.card.winner{
    z-index:6;

}
.card.red.winner{ box-shadow:0 0 30px 12px #ff3030; }
.card.black.winner{ box-shadow:0 0 30px 12px #ffffff; }
.card.green.winner{ box-shadow:0 0 35px 14px #33ff33; }
.card.yellow.winner{ box-shadow:0 0 35px 14px #ffd700; }

#money{
    display:block;

#money::placeholder{ color:#999; font-weight:400; }

.quickBets{

/* Кнопки ставок */
button{

/* Пружина при клике */
button:active{

.redBtn{

/* Модалка пароля */

    position:fixed;

@media (max-width: 700px){

button:hover{

button:disabled,
input:disabled{

/* История */
.history{

}

.history span{

/* Монеты */
.coin{
    position:absolute;
    width:40px;

/* Джекпот вспышка */
.jackpotFlash{

@keyframes jackpotFlashAnim{
    0%{ opacity:0; }

.bigCoin{

<body>

<audio id="x25Sound" src="jackpot.mp3"></audio>

<div class="pageHeader">

    <div class="topControls">

<div class="passModal" id="passModal" hidden>

        <div id="passwordStep">
            <input class="passInput" id="passInput" type="password" autocomplete="off" placeholder="Пароль" onkeydown="if(event.key==='Enter') checkPassword()">
            <div class="passError" id="passError" role="alert"></div>
            <div class="passActions">
                <button class="passCancel" type="button" onclick="closeTopUp()">Отмена</button>

        <div id="amountStep" hidden>

                <button class="passCancel" type="button" onclick="closeTopUp()">Отмена</button>
                <button class="passConfirm" type="button" onclick="addMoney()">Добавить</button>
            </div>
        </div>
    </div>
</div>

<div class="pageContent">

<div class="roundTimer">До следующей рулетки: <span id="roundTimer">20.00</span> сек.</div>

    <div class="pointer"></div>
    <div class="track" id="track"></div>
</div>

<input id="money" type="number" min="1" step="1" placeholder="Ставка">

<div class="quickBets">
    <button type="button" onclick="addToBet(100)">+100</button>
    <button type="button" onclick="addToBet(500)">+500</button>

    <button type="button" onclick="betAll()">Все</button>
</div>

<br>

<button id="redBtn" class="redBtn" onclick="choose('red')">x2</button>
<button id="blackBtn" class="blackBtn" onclick="choose('black')">x2</button>
<button id="greenBtn" class="greenBtn" onclick="choose('green')">x25</button>
<button id="coinBtn" class="coinBtn" onclick="choose('coin')">🪙</button>

<br>

<button class="spinBtn" onclick="placeBet()">СТАВКА</button>

Последние выпадения: <span id="history"></span>
</div>

<div class="coinModal" id="coinModal" hidden>
    <div class="coinDialog">
        <h2>🪙 Выбери сторону монеты</h2>
        <div class="coinFlipDisplay" id="coinFlipDisplay">🪙</div>
        <div id="coinFlipText">Синяя — слева, красная — справа</div>
        <div class="coinOptions">
            <button class="coinPickBlue" id="coinPickBlue" type="button" onclick="pickCoinSide('blue')">🔵 Синяя</button>
            <button class="coinPickRed" id="coinPickRed" type="button" onclick="pickCoinSide('red')">🔴 Красная</button>
        </div>
    </div>
</div>

<script>
let choice = null;
let spinning = false;
let historyList = [];
let audioContext = null;
let rouletteSoundTimer = null;
let placedBet = null;
let nextRoundTimer = null;
let countdownTimer = null;
let roundDeadline = null;
const ROUND_INTERVAL = 20000;

const track = document.getElementById("track");
const historyBlock = document.getElementById("history");
const x25Sound = document.getElementById("x25Sound");
function loadBalance(){
    const stored=localStorage.getItem("ronikCasinoBalance");
    if(stored===null) return 1500;
    const saved=Number(stored);
    return Number.isSafeInteger(saved) && saved>=0 ? saved : 1500;
}

const legacyLogin=localStorage.getItem("ronikCasinoLogin");
if(legacyLogin){
    const legacyBalance=localStorage.getItem("ronikCasinoBalance:"+legacyLogin);
    if(legacyBalance!==null && Number.isSafeInteger(Number(legacyBalance)) && Number(legacyBalance)>=0){
        localStorage.setItem("ronikCasinoBalance",legacyBalance);
    }
    localStorage.removeItem("ronikCasinoLogin");
}

let balance = loadBalance();

const TOP_UP_PASSWORD_HASH="7b2c97fce79ddcc9bd0b8fb8125ef5996620cf6ef930c2a9d06b848b58d9ca38";
let topUpAuthorized=false;

function openTopUp(){
    document.getElementById("passwordStep").hidden=false;
    document.getElementById("amountStep").hidden=true;
    document.getElementById("passInput").value="";
    document.getElementById("passError").textContent="";
    document.getElementById("amountError").textContent="";
    topUpAuthorized=false;
    document.getElementById("passModal").hidden=false;
    document.getElementById("passInput").focus();
}

function closeTopUp(){
    document.getElementById("passModal").hidden=true;
    topUpAuthorized=false;
}

async function checkPassword(){
    const error=document.getElementById("passError");
    const password=document.getElementById("passInput").value;
    const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(password));
    const hash=[...new Uint8Array(digest)].map(value=>value.toString(16).padStart(2,"0")).join("");
    if(hash!==TOP_UP_PASSWORD_HASH){
        error.textContent="Неверный пароль";
        document.getElementById("passInput").value="";
        document.getElementById("passInput").focus();
        return;
    }
    topUpAuthorized=true;
    document.getElementById("passwordStep").hidden=true;
    document.getElementById("amountStep").hidden=false;
    document.getElementById("addInput").focus();
}

function addMoney(){
    if(!topUpAuthorized) return;
    const amount=Number(document.getElementById("addInput").value);
    if(!Number.isSafeInteger(amount) || amount<=0 || amount>10000){
        document.getElementById("amountError").textContent="Введите целое число от 1 до 10000";
        return;
    }
    balance+=amount;
    update();
    closeTopUp();
}

function getAudioContext(){

    if(!audioContext){
        const AudioContext=window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return null;
        audioContext=new AudioContext();
    }
    if(audioContext.state==="suspended") audioContext.resume();
    return audioContext;
}

function playTone(frequency,duration,volume=0.04){
    const context=getAudioContext();
    if(!context) return;

    const oscillator=context.createOscillator();
    const gain=context.createGain();
    oscillator.type="square";
    oscillator.frequency.setValueAtTime(frequency,context.currentTime);
    gain.gain.setValueAtTime(volume,context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,context.currentTime+duration);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime+duration);
}

function startRouletteSound(){
    const startedAt=performance.now();
    const playTick=()=>{
        const progress=Math.min((performance.now()-startedAt)/5000,1);
        playTone(170+Math.round(progress*60),0.035,0.025);
        const delay=55+Math.pow(progress,3)*360;
        rouletteSoundTimer=setTimeout(playTick,delay);
    };
    playTick();
}

function stopRouletteSound(){
    clearTimeout(rouletteSoundTimer);
    rouletteSoundTimer=null;
}

function playStopSound(){
    playTone(260,0.12,0.06);
    setTimeout(()=>playTone(180,0.16,0.05),70);
}

function playWinSound(color){
    const notes=color==="green" ? [659,880,1047] : color==="red" ? [523,659,784] : [494,622,740];
    notes.forEach((note,index)=>{
        setTimeout(()=>playTone(note,0.2,0.055),index*110);
    });
}

function getColorIcon(color){
    return color==="red" ? "🔴" : color==="black" ? "⚫" : color==="green" ? "💚" : "🪙";
}

function getCoinIcon(side){
    return side==="red" ? "🔴" : "🔵";
}

function flipCoin(highSide){
    const side=Math.random()<0.5 ? "red" : "blue";
    const multiplier=side===highSide ?
        Math.floor(Math.random()*11)+10 : Math.floor(Math.random()*10)+1;
    return {side,multiplier};
}

let pendingCoinFlip=null;
let pendingCoinHighSide=null;

function openCoinFlip(onComplete){
    pendingCoinFlip=onComplete;
    pendingCoinHighSide=Math.random()<0.5 ? "red" : "blue";
    const modal=document.getElementById("coinModal");
    modal.hidden=false;
    document.getElementById("coinFlipDisplay").textContent="🪙";
    document.getElementById("coinFlipDisplay").classList.remove("tossing");
    const coinFlipText=document.getElementById("coinFlipText");
    coinFlipText.className="";
    coinFlipText.textContent="Выбери сторону монеты — коэффициент решит удача";
    document.getElementById("coinPickBlue").textContent="🔵 Синяя";
    document.getElementById("coinPickRed").textContent="🔴 Красная";
    document.getElementById("coinPickBlue").disabled=false;
    document.getElementById("coinPickRed").disabled=false;
}

function pickCoinSide(side){
    if(!pendingCoinFlip) return;
    document.getElementById("coinPickBlue").disabled=true;
    document.getElementById("coinPickRed").disabled=true;
    const display=document.getElementById("coinFlipDisplay");
    display.classList.add("tossing");
    document.getElementById("coinFlipText").textContent="Монета подбрасывается...";

    const result=flipCoin(pendingCoinHighSide);
    setTimeout(()=>{
        display.classList.remove("tossing");
        display.textContent="x"+result.multiplier;
        const coinFlipText=document.getElementById("coinFlipText");
        coinFlipText.className="coinFlipResult "+result.side;
        coinFlipText.textContent=getCoinIcon(result.side)+" "+
            (result.side==="blue" ? "СИНЯЯ СТОРОНА" : "КРАСНАЯ СТОРОНА");
        const callback=pendingCoinFlip;
        pendingCoinFlip=null;
        pendingCoinHighSide=null;
        setTimeout(()=>{
            document.getElementById("coinModal").hidden=true;
            callback({...result,won:result.side===side});
        },4000);
    },1200);
}

function spawnCoinAnimation(startX,startY,offset){
    let coin=document.createElement("div");
    coin.className="coin";
    coin.innerHTML="💰";
    document.body.appendChild(coin);

    coin.style.left=startX+"px";
    coin.style.top=startY+"px";

    let rect=document.querySelector(".balance").getBoundingClientRect();
    let endX=rect.left+40+offset;
    let endY=rect.top+10;

    coin.animate([
        {transform:"scale(1)",opacity:1},
        {transform:`translate(${endX-startX}px,${endY-startY}px) scale(0.2)`,opacity:0}
    ],{duration:900,easing:"ease-out",fill:"forwards"});

    setTimeout(()=>coin.remove(),1000);
}

function moneyRain(){
    for(let i=0;i<40;i++){
        let coin=document.createElement("div");
        coin.className="coin";
        coin.innerHTML="💰";
        document.body.appendChild(coin);

        let startX=Math.random()*window.innerWidth;
        let startY=-50;

        coin.style.left=startX+"px";
        coin.style.top=startY+"px";

        let endY=window.innerHeight+100;
        let endX=startX+(Math.random()*200-100);

        coin.animate([
            {transform:"rotate(0deg)",opacity:1},
            {transform:`translate(${endX-startX}px,${endY}px) rotate(360deg)`,opacity:0}
        ],{duration:1500+Math.random()*1000,easing:"ease-in",fill:"forwards"});

        setTimeout(()=>coin.remove(),2500);
    }
}

function jackpotEffect(){
    for(let i=0;i<10;i++){
        let coin=document.createElement("div");
        coin.className="bigCoin";
        coin.innerHTML="💰";
        document.body.appendChild(coin);

        let startX=window.innerWidth/2;
        let startY=window.innerHeight/2;

        coin.style.left=startX+"px";
        coin.style.top=startY+"px";

        let endX=Math.random()*window.innerWidth;
        let endY=Math.random()*window.innerHeight;

        coin.animate([
            {transform:"scale(1)",opacity:1},
            {transform:`translate(${endX-startX}px,${endY-startY}px) scale(0.3)`,opacity:0}
        ],{duration:1200,easing:"ease-out",fill:"forwards"});

        setTimeout(()=>coin.remove(),1500);
    }
}

function updateHistory(color){
    let icon=color==="red"?"🔴":color==="black"?"⚫":color==="green"?"💚":"🪙";
    historyList.unshift(icon);
    if(historyList.length>10) historyList.pop();
    historyBlock.innerHTML=historyList.join(" ");
}

function create(){
    track.innerHTML="";
    for(let i=0;i<120;i++){
        let random=Math.random();
        let c=random<0.10?"yellow":random<0.15?"green":(i%2===0?"red":"black");
        let card=document.createElement("div");
        card.className="card "+c;
        card.innerHTML=c==="red"?"🔴":c==="black"?"⚫":c==="green"?"💚":"🪙";
        track.appendChild(card);
    }
}

function choose(c){
    choice=c;
    document.getElementById("bet").innerHTML=
        "Ставка: "+(c==="red"?"🔴":c==="black"?"⚫":c==="green"?"💚":"🪙");

    document.querySelectorAll(".redBtn, .blackBtn, .greenBtn, .coinBtn")
        .forEach(btn=>btn.classList.remove("selected"));
    document.getElementById(c+"Btn").classList.add("selected");
}

function addToBet(amount){
    const moneyInput=document.getElementById("money");
    const current=Number(moneyInput.value);
    const currentBet=Number.isFinite(current) && current>0 ? current : 0;
    moneyInput.value=Math.min(currentBet+amount,balance);
}

function betAll(){
    document.getElementById("money").value=balance;
}

function setControlsDisabled(disabled){
    document.querySelectorAll("button, #money")
        .forEach(control=>control.disabled=disabled);
}

function updateRoundTimer(){
    const remaining=Math.max(0,roundDeadline-performance.now());
    document.getElementById("roundTimer").textContent=(remaining/1000).toFixed(2);
}

function scheduleNextRound(){
    clearTimeout(nextRoundTimer);
    clearInterval(countdownTimer);
    roundDeadline=performance.now()+ROUND_INTERVAL;
    updateRoundTimer();

    countdownTimer=setInterval(updateRoundTimer,50);

    nextRoundTimer=setTimeout(()=>{
        updateRoundTimer();
        clearInterval(countdownTimer);
        startRound(placedBet);
    },ROUND_INTERVAL);
}

function placeBet(){
    if(placedBet) return alert("Ставка уже принята. Ждём следующий раунд");

    let money=Number(document.getElementById("money").value);
    if(!choice) return alert("Выбери цвет");
    if(!Number.isSafeInteger(money) || money<=0 || money>balance) return alert("Неверная ставка");

    placedBet={money,color:choice};
    setControlsDisabled(true);
    balance-=money;
    update();
    document.getElementById("result").textContent=
        "✅ Ставка принята: "+money+" 💰. Ждём следующую рулетку...";
}

function startRound(bet){
    if(spinning) return;
    spinning=true;
    setControlsDisabled(true);
    document.getElementById("result").textContent=bet ?
        "🎲 Рулетка крутится..." : "🎲 Рулетка крутится для истории...";

    startMainRoulette(bet?.money ?? 0,bet?.color ?? null,bet);
}

function finishMainRound(resultColor,closest,money,betColor,bet,coinResult){
    const hasWinningBet=coinResult ? coinResult.won : betColor!==null && resultColor===betColor;

    if(hasWinningBet) playWinSound(resultColor);
    else playStopSound();

    closest.classList.add("winner");
    setTimeout(()=>closest.classList.remove("winner"),1100);
    updateHistory(resultColor);

    if(hasWinningBet){
        const colorMultiplier=resultColor==="green"?25:2;
        const multiplier=coinResult ? coinResult.multiplier : colorMultiplier;
        const winAmount=money*multiplier;

        if(resultColor==="green"){
            x25Sound.currentTime=0;
            x25Sound.play().catch(()=>{});
            moneyRain();
        }

        balance+=winAmount;
        update();
        const bal=document.querySelector(".balance");
        bal.classList.add("win");
        setTimeout(()=>bal.classList.remove("win"),600);
        if(winAmount>5000) jackpotEffect();

        document.getElementById("result").textContent=
            "🎉 +"+winAmount+" 💰"+
            (coinResult ? " · 🪙 "+getCoinIcon(coinResult.side)+" x"+coinResult.multiplier : "");
    } else if(betColor!==null) {
        const bal=document.querySelector(".balance");
        bal.classList.add("lose");
        setTimeout(()=>bal.classList.remove("lose"),500);
        document.getElementById("result").textContent=
            "❌ −"+money+" 💰"+
            (coinResult ? " · 🪙 "+getCoinIcon(coinResult.side)+" x"+coinResult.multiplier : "");
    } else {
        document.getElementById("result").textContent="🎲 Выпало "+getColorIcon(resultColor);
    }

    spinning=false;
    if(placedBet===bet) placedBet=null;
    if(!placedBet) setControlsDisabled(false);
    scheduleNextRound();
}

function startMainRoulette(money,betColor,bet){
    startRouletteSound();
    create();

    track.style.transition="none";
    track.style.transform="translateX(0px)";

    setTimeout(()=>{
        let index=Math.floor(Math.random()*40)+60;
        let card=document.querySelector(".card");
        let itemWidth=card.offsetWidth;

        let rect=document.querySelector(".roulette").getBoundingClientRect();
        let pointerX=rect.left+rect.width/2;
        let targetX=index*itemWidth+itemWidth/2;
        let move=pointerX-rect.left-targetX;

        track.style.transition="transform 5s cubic-bezier(.1,.8,.2,1)";
        track.style.transform=`translateX(${move}px)`;

        setTimeout(()=>{
            stopRouletteSound();

            let cards=document.querySelectorAll(".card");
            let closest=null;
            let closestDist=Infinity;

            cards.forEach(card=>{
                let r=card.getBoundingClientRect();
                let center=r.left+r.width/2;
                let dist=Math.abs(center-pointerX);
                if(dist<closestDist){
                    closestDist=dist;
                    closest=card;
                }
            });

            let resultColor=
                closest.classList.contains("red")?"red":
                closest.classList.contains("black")?"black":
                closest.classList.contains("green")?"green":"yellow";
            if(resultColor==="yellow" && betColor==="coin"){
                document.getElementById("result").textContent="🪙 Монета выпала! Выбери сторону.";
                openCoinFlip(coinResult=>
                    finishMainRound(resultColor,closest,money,betColor,bet,coinResult)
                );
            } else {
                finishMainRound(resultColor,closest,money,betColor,bet,null);
            }
        },5200);
    },100);
}

function update(){
    document.getElementById("balance").textContent=balance;
    localStorage.setItem("ronikCasinoBalance", String(balance));
}

    create();
    update();
    scheduleNextRound();
</script>
</div>
